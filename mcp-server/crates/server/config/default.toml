[lancedb]
embedding_cache_dir = "/Users/oubiwann/lab/music-comp/ai-music-theory/mcp-server/.fastembed_cache"
embedding_model = "bge-small-en-v1.5"
enabled = true

[logging]
coloured = true
level = "info"
output = "stderr"
report_caller = false

[paths]
base = "."
concept_cards = "concept-cards"
concepts_unified = "concepts-unified"
guides = "guides"
skill_docs = "."
sources_md = "sources-md"

[search]
backend = "tantivy"
custom_stopwords = []
enable_stopwords = true
fuzzy_distance = 2
fuzzy_search = false
index_path = ".tantivy-index"
minimum_match_percent = 0.6
query_mode = "smart"
rebuild_on_startup = false
snippet_size = 200
stopword_allowlist = [
    "I",
    "V",
    "ii",
    "IV",
    "vi",
    "vii",
    "i",
    "v",
    "iv",
    "do",
    "re",
    "mi",
    "fa",
    "sol",
    "la",
    "ti",
]

[server]
name = "music-theory-skill"
version = "0.2.0"

[sources.general]
path = "~/Dropbox/Apps/General Books/Music"

[sources.general.aliases]
caplin-classical-form = ["Analyzing Classical Form (Caplin)"]
persichetti-20th-century = ["Twentieth-Century Harmony"]

[sources.general.files]
caplin-classical-form = "[2013] Caplin - Analyzing Classical Form: An Approach for the Classroom.pdf"
hutchinson-21c = "[2023] Hutchinson - Music Theory for the 21st-Century Classroom.epub"
messiaen-technique = "[1944] Messiaen - The Technique of My Musical Language.pdf"
open-music-theory = "[2022] Gotham - Open Music Theory.xml"
persichetti-20th-century = "[1961] Persichetti - Twentieth-Century Harmony: Creative Aspects and Practice.pdf"
straus-post-tonal = "[2016] Straus - Introduction to Post-Tonal Theory (Fifth Edition).pdf"
wright-math-music = "[2009] Wright - Mathematics and Music.pdf"

[sources.oxford]
path = "~/Dropbox/Apps/Oxford University Press"

[sources.oxford.aliases]
gollin-handbook = ["The Oxford Handbook of Neo-Riemannian Music Theories"]

[sources.oxford.files]
cohn-audacious = "[2012] Cohn - Audacious Euphony: Chromaticism and the Consonant Triad's Second Nature.pdf"
gollin-handbook = "[2012] Gollin - Oxford Handbook of Neo-Riemannian Music Theories.pdf"
lewin-gmit = "[2007] Lewin - Generalized Musical Intervals and Transformations.pdf"
tymoczko-geometry = "[2011] Tymoczko - A Geometry of Music.pdf"
tymoczko-tonality = "[2023] Tymoczko - Tonality - An Owners Manual.epub"

[sources.papers]
path = "~/Dropbox/Apps/Papers/Music Theory"

[sources.papers.files]
acef-sanchez = "[2012] Acef-Sanchez - An Introduction to Group Theory with applications to Mathematical Music Theory.pdf"
fiore = "[2009] Fiore - Music and Mathematics.pdf"
papadopoulos = "[2014] Papadopoulos - Mathematics and group theory in music/[2014] Papadopoulos - Mathematics and group theory in music.pdf"
