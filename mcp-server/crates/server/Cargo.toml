[package]
name = "music-theory-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "music-theory-mcp"
path = "src/main.rs"

[features]
default = []
fts = ["dep:tantivy", "dep:regex", "dep:stop-words"]
graph = ["dep:petgraph", "dep:rkyv", "dep:memmap2", "dep:blake3", "dep:chrono"]
full = ["fts", "graph"]

[dependencies]
rmcp = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
confyg = { workspace = true }
twyg = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
async-walkdir = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
shellexpand = { workspace = true }
pulldown-cmark = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }

# CLI parsing
clap = { workspace = true }

# Full-text search engine (optional)
tantivy = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
stop-words = { workspace = true, optional = true }

# Graph database (optional)
petgraph = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
