[package]
name = "music-theory-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "music-theory-mcp"
path = "src/main.rs"

[features]
default = []
fts = ["dep:tantivy", "dep:regex", "dep:stop-words", "fabryk/fts-tantivy", "fabryk-mcp/fts-tantivy"]
graph = ["dep:petgraph", "dep:rkyv", "dep:memmap2", "dep:blake3", "dep:chrono", "fabryk/graph-rkyv-cache", "fabryk-mcp/graph-rkyv-cache"]
vector = ["fabryk/vector-lancedb", "fabryk/vector-fastembed"]
http = ["fabryk-mcp/http"]
full = ["fts", "graph", "vector", "http"]

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
confyg = { workspace = true }
twyg = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
shellexpand = { workspace = true }
dirs = { workspace = true }

# CLI parsing
clap = { workspace = true }
toml_edit = { workspace = true }

# Music theory computation
music-comp-mt = { workspace = true }

# Fabryk framework (umbrella crates re-export sub-crates)
fabryk = { workspace = true }
fabryk-mcp = { workspace = true , version = "0.5.0" }
fabryk-cli = { workspace = true , version = "0.5.0" }

# Full-text search engine (optional)
tantivy = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
stop-words = { workspace = true, optional = true }

# Graph database (optional)
petgraph = { workspace = true, optional = true }
rkyv = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
