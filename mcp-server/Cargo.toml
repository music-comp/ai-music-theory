[workspace]
resolver = "2"
members = [
    "crates/server",
    "crates/design",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Duncan McGreggor <oubiwann@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/oxur/ai-music-theory"
description = "Music Theory AI Skill - MCP server for accessing music theory educational materials"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "fs", "sync"] }
async-trait = "0.1"
async-walkdir = "1"
futures = "0.3"

# Configuration and logging
confyg = "0.3"
twyg = "0.6"
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Schema support
schemars = "1.2"

# File operations and markdown
pulldown-cmark = "0.9"
yaml_serde = "0.10"
shellexpand = "3.1"
dirs = "5"

# Error handling
thiserror = "2"

# Regular expressions
regex = "1"

# Full-text search (optional)
tantivy = "0.22"
stop-words = "0.8"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Source management
strsim = "0.11"
toml_edit = { version = "0.22", features = ["serde"] }

# Graph database (optional)
petgraph = "0.8"
rkyv = { version = "0.7", features = ["validation"] }
memmap2 = "0.9"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }

# Music theory computation
music-comp-mt = { version = "0.4", features = ["serde"] }

# Fabryk framework (umbrella crates pull in sub-crates transitively)
# For local development, create .cargo/config.toml with path overrides
# (see .cargo/config.toml.example)
fabryk = { git = "https://github.com/oxur/ecl.git", branch = "main" }
fabryk-mcp = { git = "https://github.com/oxur/ecl.git", branch = "main" }
fabryk-cli = { git = "https://github.com/oxur/ecl.git", branch = "main" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
