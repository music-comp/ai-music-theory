[package]
name = "music-theory-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "0.14", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
glob = "0.3"
thiserror = "2"
schemars = "1.2"
confyg = "0.3.0"
twyg = "0.6.2"
shellexpand = "3.1.1"
log = "0.4.29"

# For future search implementation
# tantivy = "0.21"
