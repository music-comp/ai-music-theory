[package]
name = "music-theory-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "0.14", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
glob = "0.3"
shellexpand = "3"
thiserror = "2"
env_logger = "0.11"
log = "0.4"
schemars = "=0.8.21"

# For future search implementation
# tantivy = "0.21"
